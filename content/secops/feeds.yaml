# Google Security Operations - Declarative Log Ingestion Feeds
# This file declares log ingestion feeds configured in Google SecOps.
# Identifiable credentials and customer IDs are parameterized via variables and GCP Secret Manager.

workspace_orgs:
  davicruz:
    display_prefix: "DaviCruz GWS"
    customer_id_var: "gws_davicruz_customer_id"
    feeds:
      - name: "chromeos"
        display_name: "DaviCruz GWS ChromeOs"
        log_type: "WORKSPACE_CHROMEOS"
        feed_source_type: "API"
      - name: "alerts"
        display_name: "DaviCruz GWS Alerts"
        log_type: "WORKSPACE_ALERTS"
        feed_source_type: "API"
      - name: "mobile"
        display_name: "DaviCruz GWS Mobile"
        log_type: "WORKSPACE_MOBILE"
        feed_source_type: "API"
      - name: "privileges"
        display_name: "DaviCruz GWS Privileges"
        log_type: "WORKSPACE_PRIVILEGES"
        feed_source_type: "API"
      - name: "users"
        display_name: "DaviCruz GWS Users"
        log_type: "WORKSPACE_USERS"
        feed_source_type: "API"
      - name: "groups"
        display_name: "DaviCruz GWS Groups"
        log_type: "WORKSPACE_GROUPS"
        feed_source_type: "API"

  driveforjob:
    display_prefix: "DriveForJob GWS"
    customer_id_var: "gws_driveforjob_customer_id"
    feeds:
      - name: "users"
        display_name: "DriveForJob GWS Users"
        log_type: "WORKSPACE_USERS"
        feed_source_type: "API"
      - name: "alerts"
        display_name: "DriveForJob GWS Alerts"
        log_type: "WORKSPACE_ALERTS"
        feed_source_type: "API"
      - name: "mobile"
        display_name: "DriveForJob GWS Mobile"
        log_type: "WORKSPACE_MOBILE"
        feed_source_type: "API"
      - name: "groups"
        display_name: "DriveForJob GWS Groups"
        log_type: "WORKSPACE_GROUPS"
        feed_source_type: "API"
      - name: "chromeos"
        display_name: "DriveForJob GWS ChromeOs"
        log_type: "WORKSPACE_CHROMEOS"
        feed_source_type: "API"
      - name: "privileges"
        display_name: "DriveForJob GWS Privileges"
        log_type: "WORKSPACE_PRIVILEGES"
        feed_source_type: "API"

microsoft_tenants:
  davicruz:
    office_365_secret_name: "secops-feed-office365-credentials"
    entra_id_secret_name: "secops-feed-entra-credentials"
    office_365_feeds:
      - name: "exchange"
        display_name: "DaviCruz Office Audit.Exchange"
        content_type: "AUDIT_EXCHANGE"
      - name: "dlp"
        display_name: "DaviCruz Office DLP.All"
        content_type: "DLP_ALL"
      - name: "general"
        display_name: "DaviCruz Office Audit.General"
        content_type: "AUDIT_GENERAL"
      - name: "sharepoint"
        display_name: "DaviCruz Office Audit.SharePoint"
        content_type: "AUDIT_SHARE_POINT"
    entra_id_feeds:
      - name: "sign_ins"
        display_name: "DaviCruz Entra ID Sign-in Logs"
        feed_type: "AZURE_AD"
        log_type: "AZURE_AD"
      - name: "audit"
        display_name: "DaviCruz Entra ID Audit Logs"
        feed_type: "AZURE_AD_AUDIT"
        log_type: "AZURE_AD_AUDIT"
      - name: "context"
        display_name: "DaviCruz EntraID Org Context"
        feed_type: "AZURE_AD_CONTEXT"
        log_type: "AZURE_AD_CONTEXT"
        retrieve_devices: true
        retrieve_groups: true
      - name: "msgraph_alerts"
        display_name: "DaviCruz MSGraph API Alerts"
        feed_type: "MICROSOFT_GRAPH_ALERT"
        log_type: "MICROSOFT_GRAPH_ALERT"
        hostname: "graph.microsoft.com/v1.0/security/alerts_v2"
