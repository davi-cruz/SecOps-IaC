# Nightly Scheduled Drift Detection:
# 1. Queries Chronicle API for newly created or modified rules in the web console.
# 2. Reconciles local YARA-L and YAML files.
# 3. Automatically generates declarative import blocks in 'terraform/drift_imports.tf'.
# 4. Opens a Pull Request for Human-in-the-Loop (HITL) review.

name: SecOps - Drift Detection & PR

on:
  schedule:
    # Run daily at 23:00 UTC
    - cron: "0 23 * * *"

  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  detect-drift:
    name: Scan Console Drift
    runs-on: ubuntu-latest

    env:
      GOOGLE_SECOPS_API_BASE_URL: ${{ vars.GOOGLE_SECOPS_API_BASE_URL }}
      GOOGLE_SECOPS_API_UPLOAD_BASE_URL: ${{ vars.GOOGLE_SECOPS_API_UPLOAD_BASE_URL }}
      GOOGLE_SECOPS_INSTANCE: ${{ vars.GOOGLE_SECOPS_INSTANCE }}
      AUTHORIZATION_SCOPES: ${{ vars.AUTHORIZATION_SCOPES }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER }}
          create_credentials_file: true
          cleanup_credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: pip install -r requirements_dev.txt

      - name: Detect Drift & Generate Import Blocks
        run: python -m tools.drift_detector

      - name: Create Drift Reconciliation Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix(secops): reconcile remote console changes with git"
          title: "fix(secops): automated drift reconciliation from web console"
          body: |
            ## Automated Drift Detection Report
            
            The scheduled drift detection pipeline identified updates or newly created rules in the Google SecOps web console.
            
            ### Included in this PR:
            * Synced YARA-L logic and metadata in `content/secops/rules/`.
            * Declarative `import` blocks in `terraform/drift_imports.tf` for any newly discovered rules.
            
            ### Next Steps:
            1. Review the rule diffs and ensure adherence to detection engineering standards.
            2. Verify that automated PR checks (Pytest, YARA-L API verification, and `terraform plan`) pass.
            3. Approve and merge to `main` to bind the new rules into Terraform state.
          branch: drift/secops-reconciliation
          delete-branch: true
          labels: |
            drift-detection
            automated-pr
