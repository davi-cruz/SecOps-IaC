# Static analysis of GitHub Actions workflows using zizmor.
# This workflow runs whenever a workflow file is created or updated.

name: SecOps - Zizmor Scan

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  zizmor:
    name: Zizmor Linter
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run zizmor
        run: pipx run zizmor --format=github .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
