# CI/CD Deployment Pipeline for Google Security Operations (Terraform Apply)
# Executes on push to main to deploy feeds, rules, and reference lists.
# Protected via GitHub 'production' Environment.

name: SecOps - Deploy Content (Terraform)

on:
  push:
    branches:
      - main
    paths:
      - "content/secops/**"
      - "terraform/**"
      - ".github/workflows/SecOps-Update-Remote-Content.yaml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: production

    env:
      GOOGLE_SECOPS_API_BASE_URL: ${{ vars.GOOGLE_SECOPS_API_BASE_URL || 'https://us-chronicle.googleapis.com/v1alpha' }}
      TF_VAR_project_id: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
      TF_VAR_chronicle_location: ${{ vars.GOOGLE_SECOPS_LOCATION || 'us' }}
      TF_VAR_chronicle_instance_id: ${{ vars.GOOGLE_SECOPS_INSTANCE_UUID }}
      TF_VAR_gws_davicruz_customer_id: ${{ vars.GWS_DAVICRUZ_CUSTOMER_ID }}
      TF_VAR_gws_davicruz_admin_email: ${{ vars.GWS_DAVICRUZ_ADMIN_EMAIL }}
      TF_VAR_gws_driveforjob_customer_id: ${{ vars.GWS_DRIVEFORJOB_CUSTOMER_ID }}
      TF_VAR_gws_driveforjob_admin_email: ${{ vars.GWS_DRIVEFORJOB_ADMIN_EMAIL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER }}
          create_credentials_file: true
          cleanup_credentials: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        env:
          TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        run: |
          cd terraform
          terraform init -backend-config="bucket=${TERRAFORM_STATE_BUCKET}"

      - name: Force Delete Archived Rules via API
        run: |
          bash tools/force_delete_rules.sh || true

      - name: Reconcile Terraform State
        run: |
          cd terraform
          terraform state rm 'module.chronicle_rules.google_chronicle_rule.rules["archived/github_repository_archived_or_deleted"]' 2>/dev/null || true
          terraform state rm 'module.chronicle_rules.google_chronicle_rule_deployment.deployments["archived/github_repository_archived_or_deleted"]' 2>/dev/null || true
          terraform state rm 'module.chronicle_feeds.google_chronicle_feed.feeds["driveforjob_gws_activity"]' 2>/dev/null || true
          terraform state rm 'module.chronicle_rules.google_chronicle_rule.archived_rules["archived/cloud_honeypot_secret_access_archived_37840bc"]' 2>/dev/null || true
          terraform state rm 'module.chronicle_rules.google_chronicle_rule_deployment.deployments["archived/cloud_honeypot_secret_access_archived_37840bc"]' 2>/dev/null || true
          terraform state rm 'module.chronicle_rules.google_chronicle_rule.archived_rules["archived/prt_use_case_1_archived_37840bc"]' 2>/dev/null || true
          terraform state rm 'module.chronicle_rules.google_chronicle_rule_deployment.deployments["archived/prt_use_case_1_archived_37840bc"]' 2>/dev/null || true
          terraform state rm 'module.chronicle_rules.google_chronicle_rule.archived_rules["archived/rule_1727979376900_archived_37840bc"]' 2>/dev/null || true
          terraform state rm 'module.chronicle_rules.google_chronicle_rule_deployment.deployments["archived/rule_1727979376900_archived_37840bc"]' 2>/dev/null || true
          terraform state rm 'module.chronicle_rules.google_chronicle_rule.archived_rules["archived/rule_1750794727496_archived_37840bc"]' 2>/dev/null || true
          terraform state rm 'module.chronicle_rules.google_chronicle_rule_deployment.deployments["archived/rule_1750794727496_archived_37840bc"]' 2>/dev/null || true
          terraform state rm 'module.chronicle_rules.google_chronicle_rule.archived_rules["archived/suspicious_auth_unusual_interval_time_archived_37840bc"]' 2>/dev/null || true
          terraform state rm 'module.chronicle_rules.google_chronicle_rule_deployment.deployments["archived/suspicious_auth_unusual_interval_time_archived_37840bc"]' 2>/dev/null || true

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve -parallelism=15
