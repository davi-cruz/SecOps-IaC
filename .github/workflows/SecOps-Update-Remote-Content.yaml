# CI/CD Deployment Pipeline for Google Security Operations (Terraform Apply)
# Executes on push to main to deploy feeds, rules, and reference lists.
# Protected via GitHub 'production' Environment.

name: SecOps - Deploy Content (Terraform)

on:
  push:
    branches:
      - main
    paths:
      - "content/secops/**"
      - "terraform/**"
      - ".github/workflows/SecOps-Update-Remote-Content.yaml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: production

    env:
      TF_VAR_project_id: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
      TF_VAR_chronicle_location: ${{ vars.GOOGLE_SECOPS_LOCATION || 'us' }}
      TF_VAR_chronicle_instance_id: ${{ vars.GOOGLE_SECOPS_INSTANCE_UUID }}
      TF_VAR_gws_davicruz_customer_id: ${{ vars.GWS_DAVICRUZ_CUSTOMER_ID }}
      TF_VAR_gws_davicruz_admin_email: ${{ vars.GWS_DAVICRUZ_ADMIN_EMAIL }}
      TF_VAR_gws_driveforjob_customer_id: ${{ vars.GWS_DRIVEFORJOB_CUSTOMER_ID }}
      TF_VAR_gws_driveforjob_admin_email: ${{ vars.GWS_DRIVEFORJOB_ADMIN_EMAIL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER }}
          create_credentials_file: true
          cleanup_credentials: true

      - name: Diagnose GCP Identity & Secret Access
        env:
          GOOGLE_CLOUD_PROJECT_ID: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
        run: |
          echo "=== Active GCP Account ==="
          gcloud auth list
          echo "=== Secrets in project ${GOOGLE_CLOUD_PROJECT_ID} ==="
          gcloud secrets list --project="${GOOGLE_CLOUD_PROJECT_ID}" || true
          echo "=== Testing access to individual secrets ==="
          for s in secops-feed-office365-credentials secops-feed-entra-credentials secops-feed-gws-sa-key secops-feed-gws-davicruz-config secops-feed-gws-driveforjob-config; do
            echo -n "Checking $s: "
            if gcloud secrets versions access latest --secret="$s" --project="${GOOGLE_CLOUD_PROJECT_ID}" > /dev/null 2>&1; then
              echo "SUCCESS"
            else
              echo "FAILED (not accessible or does not exist)"
            fi
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        env:
          TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        run: |
          cd terraform
          terraform init -backend-config="bucket=${TERRAFORM_STATE_BUCKET}"

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve -parallelism=15
