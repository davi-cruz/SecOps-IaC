# CI/CD Pull Request Quality Gate:
# 1. Run Python unit tests and metadata style guide verification.
# 2. Verify all YARA-L detection rules against Google SecOps API (verify_rule).
# 3. Validate Terraform configuration and execute speculative 'terraform plan'.

name: SecOps - PR Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - "content/secops/**"
      - "terraform/**"
      - ".github/workflows/SecOps-Run-Tests.yaml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  validate-and-plan:
    runs-on: ubuntu-latest

    env:
      GOOGLE_SECOPS_API_BASE_URL: ${{ vars.GOOGLE_SECOPS_API_BASE_URL }}
      GOOGLE_SECOPS_API_UPLOAD_BASE_URL: ${{ vars.GOOGLE_SECOPS_API_UPLOAD_BASE_URL }}
      GOOGLE_SECOPS_INSTANCE: ${{ vars.GOOGLE_SECOPS_INSTANCE }}
      AUTHORIZATION_SCOPES: ${{ vars.AUTHORIZATION_SCOPES }}
      TF_VAR_project_id: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
      TF_VAR_chronicle_location: ${{ vars.GOOGLE_SECOPS_LOCATION || 'us' }}
      TF_VAR_chronicle_instance_id: ${{ vars.GOOGLE_SECOPS_INSTANCE_UUID }}
      TF_VAR_gws_davicruz_customer_id: ${{ vars.GWS_DAVICRUZ_CUSTOMER_ID }}
      TF_VAR_gws_davicruz_admin_email: ${{ vars.GWS_DAVICRUZ_ADMIN_EMAIL }}
      TF_VAR_gws_driveforjob_customer_id: ${{ vars.GWS_DRIVEFORJOB_CUSTOMER_ID }}
      TF_VAR_gws_driveforjob_admin_email: ${{ vars.GWS_DRIVEFORJOB_ADMIN_EMAIL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER }}
          create_credentials_file: true
          cleanup_credentials: true

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: pip install -r requirements_dev.txt

      - name: Run Metadata & Style Guide Tests
        run: python -m pytest -v

      - name: Verify YARA-L Rules via Chronicle API
        run: python -m tools.secops_content_manager.content_manager rules verify-all

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format & Validate
        run: |
          cd terraform
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Terraform Plan (Speculative)
        env:
          TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        run: |
          cd terraform
          terraform init -backend-config="bucket=${TERRAFORM_STATE_BUCKET}"
          terraform plan -no-color -parallelism=15
